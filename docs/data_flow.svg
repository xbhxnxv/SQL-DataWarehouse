<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="420" fill="#ffffff"/>
  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Data Flow — Medallion Architecture</text>

  <!-- Sources -->
  <rect x="30" y="90" width="170" height="240" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Sources</text>
  <rect x="50" y="135" width="130" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="115" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">CRM</text>
  <text x="115" y="178" text-anchor="middle" font-size="10" fill="#6b7280">3 CSV files</text>
  <rect x="50" y="215" width="130" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="115" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">ERP</text>
  <text x="115" y="258" text-anchor="middle" font-size="10" fill="#6b7280">3 CSV files</text>

  <!-- Bronze -->
  <rect x="250" y="90" width="170" height="240" rx="10" fill="#fbe8d3" stroke="#c8843c" stroke-width="1.5"/>
  <text x="335" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a1e">Bronze</text>
  <text x="335" y="138" text-anchor="middle" font-size="10.5" fill="#8a5a1e">Raw</text>
  <text x="335" y="176" text-anchor="middle" font-size="10.5" fill="#5b4327">Load as-is</text>
  <text x="335" y="196" text-anchor="middle" font-size="10.5" fill="#5b4327">BULK INSERT</text>
  <text x="335" y="216" text-anchor="middle" font-size="10.5" fill="#5b4327">Truncate + reload</text>
  <text x="335" y="236" text-anchor="middle" font-size="10.5" fill="#5b4327">6 tables</text>

  <!-- Silver -->
  <rect x="470" y="90" width="170" height="240" rx="10" fill="#e6eaee" stroke="#7b8794" stroke-width="1.5"/>
  <text x="555" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#4b5563">Silver</text>
  <text x="555" y="138" text-anchor="middle" font-size="10.5" fill="#4b5563">Cleaned</text>
  <text x="555" y="176" text-anchor="middle" font-size="10.5" fill="#3f4854">Trim + dedup</text>
  <text x="555" y="196" text-anchor="middle" font-size="10.5" fill="#3f4854">Standardize codes</text>
  <text x="555" y="216" text-anchor="middle" font-size="10.5" fill="#3f4854">Cast + derive cols</text>
  <text x="555" y="236" text-anchor="middle" font-size="10.5" fill="#3f4854">6 tables</text>

  <!-- Gold -->
  <rect x="690" y="90" width="170" height="240" rx="10" fill="#fdf1c4" stroke="#c9a227" stroke-width="1.5"/>
  <text x="775" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d0f">Gold</text>
  <text x="775" y="138" text-anchor="middle" font-size="10.5" fill="#8a6d0f">Business-ready</text>
  <text x="775" y="176" text-anchor="middle" font-size="10.5" fill="#5f4c0c">Star schema (views)</text>
  <text x="775" y="200" text-anchor="middle" font-size="10.5" fill="#5f4c0c">dim_customers</text>
  <text x="775" y="220" text-anchor="middle" font-size="10.5" fill="#5f4c0c">dim_products</text>
  <text x="775" y="240" text-anchor="middle" font-size="10.5" fill="#5f4c0c">fact_sales</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#4b5563"/>
    </marker>
  </defs>
  <line x1="200" y1="210" x2="248" y2="210" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="210" x2="468" y2="210" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="210" x2="688" y2="210" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Consumers -->
  <text x="775" y="372" text-anchor="middle" font-size="11" fill="#6b7280">→ BI / Reporting / Ad-hoc analytics</text>
</svg>
