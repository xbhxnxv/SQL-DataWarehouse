<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Gold Layer — Star Schema</text>

  <!-- Lines (behind boxes) -->
  <line x1="250" y1="255" x2="360" y2="255" stroke="#9ca3af" stroke-width="2"/>
  <line x1="540" y1="255" x2="650" y2="255" stroke="#9ca3af" stroke-width="2"/>

  <!-- dim_customers (left) -->
  <rect x="40" y="150" width="210" height="210" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="40" y="150" width="210" height="34" rx="8" fill="#6366f1"/>
  <text x="145" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">dim_customers</text>
  <text x="56" y="208" font-size="11.5" font-weight="700" fill="#3730a3">PK  customer_key</text>
  <text x="56" y="230" font-size="11" fill="#374151">customer_id</text>
  <text x="56" y="250" font-size="11" fill="#374151">first_name / last_name</text>
  <text x="56" y="270" font-size="11" fill="#374151">country</text>
  <text x="56" y="290" font-size="11" fill="#374151">marital_status</text>
  <text x="56" y="310" font-size="11" fill="#374151">gender</text>
  <text x="56" y="330" font-size="11" fill="#374151">birthdate</text>
  <text x="56" y="350" font-size="11" fill="#374151">create_date</text>

  <!-- fact_sales (center) -->
  <rect x="360" y="140" width="180" height="230" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="360" y="140" width="180" height="34" rx="8" fill="#d97706"/>
  <text x="450" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">fact_sales</text>
  <text x="376" y="198" font-size="11.5" font-weight="700" fill="#92400e">FK  product_key</text>
  <text x="376" y="220" font-size="11.5" font-weight="700" fill="#92400e">FK  customer_key</text>
  <text x="376" y="244" font-size="11" fill="#374151">order_number</text>
  <text x="376" y="264" font-size="11" fill="#374151">order_date</text>
  <text x="376" y="284" font-size="11" fill="#374151">shipping_date</text>
  <text x="376" y="304" font-size="11" fill="#374151">due_date</text>
  <text x="376" y="324" font-size="11" fill="#374151">sales_amount</text>
  <text x="376" y="344" font-size="11" fill="#374151">quantity</text>
  <text x="376" y="362" font-size="11" fill="#374151">price</text>

  <!-- dim_products (right) -->
  <rect x="650" y="150" width="210" height="210" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="650" y="150" width="210" height="34" rx="8" fill="#10b981"/>
  <text x="755" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">dim_products</text>
  <text x="666" y="208" font-size="11.5" font-weight="700" fill="#065f46">PK  product_key</text>
  <text x="666" y="230" font-size="11" fill="#374151">product_id / number</text>
  <text x="666" y="250" font-size="11" fill="#374151">product_name</text>
  <text x="666" y="270" font-size="11" fill="#374151">category / subcategory</text>
  <text x="666" y="290" font-size="11" fill="#374151">maintenance</text>
  <text x="666" y="310" font-size="11" fill="#374151">cost</text>
  <text x="666" y="330" font-size="11" fill="#374151">product_line</text>
  <text x="666" y="350" font-size="11" fill="#374151">start_date</text>

  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#6b7280">fact_sales joins each dimension on its surrogate key (customer_key, product_key)</text>
</svg>
